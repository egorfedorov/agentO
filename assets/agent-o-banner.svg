<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <style>
    @keyframes blink {
      0%, 42%, 46%, 90%, 94%, 100% { opacity: 1; }
      44%, 92% { opacity: 0; }
    }
    @keyframes blink-inv {
      0%, 42%, 46%, 90%, 94%, 100% { opacity: 0; }
      44%, 92% { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { r: 3; opacity: 0.6; }
      50% { r: 7; opacity: 0; }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fill-food {
      0% { width: 0; }
      100% { width: 119px; }
    }
    @keyframes fill-joy {
      0% { width: 0; }
      100% { width: 129px; }
    }
    @keyframes fill-energy {
      0% { width: 0; }
      100% { width: 109px; }
    }
    @keyframes fill-xp {
      0% { width: 0; }
      100% { width: 258px; }
    }
    @keyframes fade-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes rain1 {
      0% { transform: translateY(-20px); opacity: 0.5; }
      50% { opacity: 0.1; }
      100% { transform: translateY(440px); opacity: 0.5; }
    }
    @keyframes rain2 {
      0% { transform: translateY(-30px); opacity: 0.3; }
      50% { opacity: 0.08; }
      100% { transform: translateY(440px); opacity: 0.3; }
    }
    .eyes-open { animation: blink 4s infinite; }
    .eyes-closed { animation: blink-inv 4s infinite; }
    .antenna-pulse { animation: pulse 2s infinite; }
    .cursor { animation: cursor-blink 1s step-end infinite; }
    .bar-food { animation: fill-food 1.5s ease-out 0.8s both; }
    .bar-joy { animation: fill-joy 1.5s ease-out 1.1s both; }
    .bar-energy { animation: fill-energy 1.5s ease-out 1.4s both; }
    .bar-xp { animation: fill-xp 2s ease-out 0.5s both; }
    .fade-1 { animation: fade-in 0.3s ease 2.3s both; }
    .fade-2 { animation: fade-in 0.3s ease 2.6s both; }
    .fade-3 { animation: fade-in 0.3s ease 2.9s both; }
    .fade-4 { animation: fade-in 0.5s ease 3s both; }
    .fade-5 { animation: fade-in 0.5s ease 3.3s both; }
    .fade-6 { animation: fade-in 0.5s ease 3.6s both; }
    .fade-cmd { animation: fade-in 0.5s ease 1s both; }
    .robot-group { animation: float 3s ease-in-out infinite; }
    .rain-1 { animation: rain1 8s linear infinite; }
    .rain-2 { animation: rain2 6s linear infinite; }
    .rain-3 { animation: rain1 10s linear infinite; }
    .rain-4 { animation: rain2 7s linear infinite; }
    .rain-5 { animation: rain1 9s linear infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd4e6"/>
      <stop offset="50%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#ff4081"/>
    </linearGradient>
    <linearGradient id="bar-food-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#4dd4e6"/>
    </linearGradient>
    <linearGradient id="bar-joy-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="bar-energy-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd740"/>
      <stop offset="100%" stop-color="#ff6e40"/>
    </linearGradient>
    <linearGradient id="xp-bar-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd4e6"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <rect width="800" height="420" fill="none" stroke="#4dd4e622" stroke-width="1" rx="12"/>

  <!-- Matrix rain characters -->
  <g opacity="0.06" font-family="monospace" font-size="12" fill="#4dd4e6">
    <text x="30" y="50">A</text>
    <text x="90" y="80">G</text>
    <text x="150" y="35">E</text>
    <text x="650" y="60">N</text>
    <text x="710" y="90">T</text>
    <text x="750" y="40">O</text>
    <text x="60" y="380">0</text>
    <text x="120" y="400">1</text>
    <text x="680" y="370">{</text>
    <text x="740" y="395">}</text>
    <text x="50" y="200">&gt;</text>
    <text x="750" y="210">/</text>
    <text x="30" y="300">|</text>
    <text x="770" y="300">\</text>
    <text class="rain-1" x="200" y="0">ア</text>
    <text class="rain-2" x="400" y="0">01</text>
    <text class="rain-3" x="600" y="0">ウ</text>
    <text class="rain-4" x="500" y="0">{}</text>
    <text class="rain-5" x="300" y="0">[]</text>
  </g>

  <!-- Agent-O Robot -->
  <g class="robot-group">
    <text font-family="monospace" font-size="13" fill="#4dd4e6" xml:space="preserve">
      <tspan x="80" y="78">      ┌┤██├┐</tspan>
      <tspan x="80" y="94">  ┌───┤ ▓▓ ├───┐</tspan>
      <tspan x="80" y="110">  │ ╔═══════╗  │</tspan>
      <tspan x="80" y="126">  │ ║       ║  │</tspan>
      <tspan x="80" y="142">  │ ║   ═   ║  │</tspan>
      <tspan x="80" y="158">  │ ║ └───┘ ║  │</tspan>
      <tspan x="80" y="174">  │ ╚═══════╝  │</tspan>
      <tspan x="80" y="190">  └──────┬──────┘</tspan>
      <tspan x="80" y="206">   ┌─────┴─────┐</tspan>
      <tspan x="80" y="222">   │  AGENT-O  │</tspan>
      <tspan x="80" y="238">   │ ░░░░░░░░░ │</tspan>
      <tspan x="80" y="254">   └─────┬─────┘</tspan>
      <tspan x="80" y="270">     ┌───┴───┐</tspan>
      <tspan x="80" y="286">     █       █</tspan>
    </text>

    <!-- Eyes open -->
    <text class="eyes-open" x="116" y="126" font-family="monospace" font-size="13" fill="#00e676">●   ●</text>
    <!-- Eyes closed -->
    <text class="eyes-closed" x="116" y="126" font-family="monospace" font-size="13" fill="#4dd4e6">─   ─</text>

    <!-- Antenna pulse -->
    <circle class="antenna-pulse" cx="143" cy="66" r="3" fill="#4dd4e6"/>
  </g>

  <!-- Title -->
  <text x="340" y="95" font-family="monospace" font-size="42" font-weight="bold" fill="url(#title-grad)">Agent-O</text>
  <text x="340" y="125" font-family="monospace" font-size="13" fill="#8892b0">Your ASCII desktop companion</text>
  <text x="340" y="145" font-family="monospace" font-size="13" fill="#8892b0">for Claude CLI &amp; Codex CLI</text>

  <!-- Badges -->
  <g font-family="monospace" font-size="10" font-weight="bold">
    <rect x="340" y="160" width="65" height="20" rx="10" fill="#ff6e4020" stroke="#ff6e4050" stroke-width="1"/>
    <text x="355" y="174" fill="#ff6e40">Swift 5</text>
    <rect x="412" y="160" width="75" height="20" rx="10" fill="#4dd4e620" stroke="#4dd4e650" stroke-width="1"/>
    <text x="424" y="174" fill="#4dd4e6">macOS 12+</text>
    <rect x="494" y="160" width="55" height="20" rx="10" fill="#00e67620" stroke="#00e67650" stroke-width="1"/>
    <text x="505" y="174" fill="#00e676">0 deps</text>
    <rect x="556" y="160" width="42" height="20" rx="10" fill="#b388ff20" stroke="#b388ff50" stroke-width="1"/>
    <text x="565" y="174" fill="#b388ff">MIT</text>
  </g>

  <!-- Stats panel -->
  <g font-family="monospace">
    <rect x="340" y="200" width="420" height="130" rx="8" fill="#0d1117" stroke="#4dd4e622" stroke-width="1"/>

    <!-- Level & XP header -->
    <text x="360" y="225" font-size="12" font-weight="bold" fill="#b388ff">★ Level 7</text>
    <text x="440" y="225" font-size="11" fill="#8892b0">Stage: Epic</text>
    <text x="570" y="225" font-size="11" fill="#8892b0">XP: 680/1000</text>

    <!-- XP bar -->
    <rect x="360" y="232" width="380" height="6" rx="3" fill="#1a1a2e"/>
    <rect class="bar-xp" x="360" y="232" width="0" height="6" rx="3" fill="url(#xp-bar-g)"/>

    <!-- Food -->
    <text x="360" y="262" font-size="11" fill="#8892b0">Food</text>
    <rect x="420" y="252" width="140" height="8" rx="4" fill="#1a1a2e"/>
    <rect class="bar-food" x="420" y="252" width="0" height="8" rx="4" fill="url(#bar-food-g)"/>
    <text class="fade-1" x="570" y="262" font-size="10" fill="#00e676" opacity="0">85%</text>

    <!-- Joy -->
    <text x="360" y="284" font-size="11" fill="#8892b0">Joy</text>
    <rect x="420" y="274" width="140" height="8" rx="4" fill="#1a1a2e"/>
    <rect class="bar-joy" x="420" y="274" width="0" height="8" rx="4" fill="url(#bar-joy-g)"/>
    <text class="fade-2" x="570" y="284" font-size="10" fill="#ff4081" opacity="0">92%</text>

    <!-- Energy -->
    <text x="360" y="306" font-size="11" fill="#8892b0">Energy</text>
    <rect x="420" y="296" width="140" height="8" rx="4" fill="#1a1a2e"/>
    <rect class="bar-energy" x="420" y="296" width="0" height="8" rx="4" fill="url(#bar-energy-g)"/>
    <text class="fade-3" x="570" y="306" font-size="10" fill="#ffd740" opacity="0">78%</text>

    <!-- Side stats -->
    <text class="fade-4" x="620" y="262" font-size="10" fill="#ffd740" opacity="0">★ 23 achievements</text>
    <text class="fade-5" x="620" y="284" font-size="10" fill="#4dd4e6" opacity="0">◆ 4 skins</text>
    <text class="fade-6" x="620" y="306" font-size="10" fill="#b388ff" opacity="0">◇ 5 themes</text>
  </g>

  <!-- Terminal install command -->
  <g font-family="monospace">
    <rect x="80" y="355" width="640" height="40" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="98" cy="375" r="5" fill="#ff5f57"/>
    <circle cx="114" cy="375" r="5" fill="#febc2e"/>
    <circle cx="130" cy="375" r="5" fill="#28c840"/>
    <text class="fade-cmd" x="150" y="380" font-size="13" fill="#00e676" opacity="0">$ git clone https://github.com/egorfedorov/agentO &amp;&amp; ./run.sh</text>
    <rect class="cursor" x="638" y="367" width="8" height="15" fill="#00e676"/>
  </g>
</svg>
