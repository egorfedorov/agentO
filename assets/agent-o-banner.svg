<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes eyes-blink {
      0%, 42%, 46%, 90%, 94%, 100% { opacity: 1; }
      44%, 92% { opacity: 0; }
    }
    @keyframes eyes-blink-inv {
      0%, 42%, 46%, 90%, 94%, 100% { opacity: 0; }
      44%, 92% { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.1; }
    }
    @keyframes l1  { 0%, 5%  { opacity: 0; } 6%  { opacity: 1; } }
    @keyframes l2  { 0%, 12% { opacity: 0; } 13% { opacity: 1; } }
    @keyframes l3  { 0%, 20% { opacity: 0; } 21% { opacity: 1; } }
    @keyframes l4  { 0%, 28% { opacity: 0; } 29% { opacity: 1; } }
    @keyframes l5  { 0%, 36% { opacity: 0; } 37% { opacity: 1; } }
    @keyframes l6  { 0%, 44% { opacity: 0; } 45% { opacity: 1; } }
    @keyframes l7  { 0%, 52% { opacity: 0; } 53% { opacity: 1; } }
    @keyframes l8  { 0%, 60% { opacity: 0; } 61% { opacity: 1; } }

    text {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
    }

    .cursor { animation: blink 1s step-end infinite; }
    .eyes-open { animation: eyes-blink 4s ease infinite; }
    .eyes-closed { animation: eyes-blink-inv 4s ease infinite; }
    .antenna { animation: pulse 2s ease infinite; }

    .s1 { opacity: 0; animation: l1 12s ease forwards; }
    .s2 { opacity: 0; animation: l2 12s ease forwards; }
    .s3 { opacity: 0; animation: l3 12s ease forwards; }
    .s4 { opacity: 0; animation: l4 12s ease forwards; }
    .s5 { opacity: 0; animation: l5 12s ease forwards; }
    .s6 { opacity: 0; animation: l6 12s ease forwards; }
    .s7 { opacity: 0; animation: l7 12s ease forwards; }
    .s8 { opacity: 0; animation: l8 12s ease forwards; }

    .cyan    { fill: #4dd4e6; }
    .green   { fill: #00e676; }
    .purple  { fill: #b388ff; }
    .pink    { fill: #ff4081; }
    .yellow  { fill: #ffd740; }
    .orange  { fill: #ff6e40; }
    .gray    { fill: #8892b0; }
    .white   { fill: #e6f1ff; }
    .dim     { fill: #484f58; }
    .title-c { fill: #8b949e; font-size: 13px; }
  </style>

  <!-- Window frame -->
  <rect width="800" height="440" rx="10" fill="#0d1117"/>
  <rect width="800" height="440" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="798" height="35" rx="9" fill="#161b22"/>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="20" cy="18" r="6" fill="#f85149"/>
  <circle cx="40" cy="18" r="6" fill="#d29922"/>
  <circle cx="60" cy="18" r="6" fill="#3fb950"/>

  <!-- Title -->
  <text x="400" y="23" text-anchor="middle" class="title-c">Agent-O -- Your ASCII Desktop Companion</text>

  <!-- Left side: Robot ASCII art -->
  <g transform="translate(30, 56)">
    <text x="0" y="16"  class="cyan">      +--||--+</text>
    <text x="0" y="32"  class="cyan">  +---| :::: |---+</text>
    <text x="0" y="48"  class="cyan">  | +=========+ |</text>
    <text x="0" y="64"  class="cyan">  | |         | |</text>
    <text x="0" y="80"  class="cyan">  | |   ===   | |</text>
    <text x="0" y="96"  class="cyan">  | | +-----+ | |</text>
    <text x="0" y="112" class="cyan">  | +=========+ |</text>
    <text x="0" y="128" class="cyan">  +------+------+</text>
    <text x="0" y="144" class="cyan">   +-----+-----+</text>
    <text x="0" y="160" class="cyan">   |  AGENT-O  |</text>
    <text x="0" y="176" class="cyan">   | ......... |</text>
    <text x="0" y="192" class="cyan">   +-----+-----+</text>
    <text x="0" y="208" class="cyan">     +---+---+</text>
    <text x="0" y="224" class="cyan">     |       |</text>

    <!-- Eyes open (blinking) -->
    <text class="eyes-open" x="36" y="64" fill="#00e676">O   O</text>
    <!-- Eyes closed (inverse blink) -->
    <text class="eyes-closed" x="36" y="64" fill="#4dd4e6">-   -</text>

    <!-- Antenna pulse dot -->
    <circle class="antenna" cx="63" cy="4" r="4" fill="#4dd4e6"/>
  </g>

  <!-- Right side: Interactive terminal demo -->
  <g transform="translate(280, 56)">

    <!-- Line 1: prompt + command -->
    <g class="s1">
      <text x="0" y="16" class="green">&gt;</text>
      <text x="16" y="16" class="white">explain this function</text>
    </g>

    <!-- Line 2: loading indicator -->
    <g class="s2">
      <text x="0" y="40" class="gray">... asking claude</text>
    </g>

    <!-- Line 3: response -->
    <g class="s3">
      <text x="0" y="64" class="white">This function uses Kadane's algorithm</text>
      <text x="0" y="82" class="white">to find the maximum subarray sum.</text>
      <text x="0" y="100" class="dim">Time: O(n), Space: O(1)</text>
    </g>

    <!-- Line 4: done + XP -->
    <g class="s4">
      <text x="0" y="128" class="green">[ok] Done! +15 XP</text>
      <text x="200" y="128" class="gray">&lt;- Level 7 Epic</text>
    </g>

    <!-- Line 5: feed command -->
    <g class="s5">
      <text x="0" y="162" class="green">&gt;</text>
      <text x="16" y="162" class="white">!feed</text>
      <text x="80" y="162" class="gray">&lt;- take care of your pet</text>
    </g>

    <!-- Line 6: feed response -->
    <g class="s6">
      <text x="0" y="186" class="green">[+] Fed Agent-O! Food: 100%</text>
    </g>

    <!-- Line 7: achievement -->
    <g class="s7">
      <text x="0" y="210" class="yellow">[*] ACHIEVEMENT: Caretaker (+30 XP)</text>
    </g>

    <!-- Line 8: stats -->
    <g class="s8">
      <text x="0" y="244" class="green">&gt;</text>
      <text x="16" y="244" class="white">!stats</text>
    </g>

    <!-- Stats block -->
    <g class="s8">
      <text x="0" y="270" class="purple">* Lvl 7 | XP: 680/1000 | Epic</text>
      <text x="0" y="290" class="green">Food: 100%</text>
      <text x="120" y="290" class="pink">Joy: 92%</text>
      <text x="230" y="290" class="yellow">Energy: 78%</text>
    </g>

    <!-- Stats bars -->
    <g class="s8">
      <rect x="0" y="300" width="130" height="4" rx="2" fill="#21262d"/>
      <rect x="0" y="300" width="130" height="4" rx="2" fill="#00e676"/>

      <rect x="140" y="300" width="100" height="4" rx="2" fill="#21262d"/>
      <rect x="140" y="300" width="92" height="4" rx="2" fill="#ff4081"/>

      <rect x="250" y="300" width="100" height="4" rx="2" fill="#21262d"/>
      <rect x="250" y="300" width="78" height="4" rx="2" fill="#ffd740"/>
    </g>

  </g>

  <!-- Bottom bar: badges -->
  <rect x="1" y="400" width="798" height="39" rx="9" fill="#161b22"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#30363d" stroke-width="1"/>

  <text x="30"  y="425" font-size="11" class="orange">Swift 5</text>
  <text x="100" y="425" font-size="11" class="cyan">macOS 12+</text>
  <text x="200" y="425" font-size="11" class="green">0 deps</text>
  <text x="270" y="425" font-size="11" class="purple">MIT</text>
  <text x="320" y="425" font-size="11" class="dim">~50KB</text>
  <text x="400" y="425" font-size="11" class="dim">23 achievements</text>
  <text x="530" y="425" font-size="11" class="dim">4 skins</text>
  <text x="600" y="425" font-size="11" class="dim">5 themes</text>
  <text x="680" y="425" font-size="11" class="dim">18 langs</text>

  <!-- Blinking cursor at bottom of terminal area -->
  <rect class="cursor" x="296" y="358" width="8" height="15" fill="#00e676"/>
</svg>
